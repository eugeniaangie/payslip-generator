definitions:
  controller.CreateAttendancePeriodRequest:
    properties:
      end_date:
        example: "2025-01-31"
        type: string
      start_date:
        example: "2025-01-01"
        type: string
    type: object
  controller.CreateOvertimeRequest:
    properties:
      hours:
        example: 1
        type: integer
    type: object
  controller.CreatePayslipRequest:
    properties:
      period_id:
        example: 0370f6f0-5762-4bbe-a57c-b398c2c76dd2
        type: string
    type: object
  controller.CreateReimbursementRequest:
    properties:
      amount:
        example: 100000
        type: integer
      date:
        example: "2025-01-01"
        type: string
      description:
        example: Transportation
        type: string
    type: object
  controller.CreateSalaryRequest:
    properties:
      amount:
        example: 100000
        type: integer
      is_active:
        example: true
        type: boolean
      user_id:
        example: 369e9c16-2df2-4a18-ab83-d6c0065ecfce
        type: string
    type: object
  controller.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  controller.RegisterRequest:
    properties:
      full_name:
        type: string
      password:
        type: string
      user_role:
        type: string
      username:
        type: string
    type: object
  controller.RunPayrollRequest:
    properties:
      period_id:
        example: 0370f6f0-5762-4bbe-a57c-b398c2c76dd2
        type: string
    type: object
info:
  contact: {}
