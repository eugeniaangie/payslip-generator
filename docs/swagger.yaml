      description: Only admin can create an attendance period by providing start and
        end dates
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Attendance Period Payload
        in: body
        name: attendance_period
        required: true
        schema:
          $ref: '#/definitions/controller.CreateAttendancePeriodRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a new attendance period
      tags:
      - Attendance Period
